<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Helvetica Neue', 'Inter', sans-serif; }
    </style>
  </defs>
  <rect width="800" height="400" fill="#0a0a0a"/>
  <!-- Wire baseline -->
  <line x1="80" y1="240" x2="420" y2="240" stroke="#444" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Drifting signal wave — smoother drift with more waypoints -->
  <path d="M 80 240 Q 100 240, 120 232 T 165 215 T 220 185 T 290 145 T 360 110 Q 390 98, 420 92" 
        fill="none" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Signal pulse dots — 6 total, building in size/opacity -->
  <circle cx="120" cy="232" r="3" fill="#f0f0f0" opacity="0.15"/>
  <circle cx="165" cy="215" r="3.5" fill="#f0f0f0" opacity="0.25"/>
  <circle cx="220" cy="185" r="4.5" fill="#f0f0f0" opacity="0.35"/>
  <circle cx="290" cy="145" r="5.5" fill="#f0f0f0" opacity="0.55"/>
  <circle cx="360" cy="110" r="7" fill="#f0f0f0" opacity="0.7"/>
  <circle cx="420" cy="92" r="8.5" fill="#f0f0f0"/>
  <!-- DRIFT text -->
  <text x="490" y="220" font-size="72" font-weight="700" fill="#f0f0f0" letter-spacing="6">DRIFT</text>
  <!-- WIRE text -->
  <text x="490" y="278" font-size="36" font-weight="300" fill="#888" letter-spacing="14">WIRE</text>
</svg>