<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="64" fill="#0a0a0a"/>
  <!-- Wire baseline -->
  <line x1="70" y1="340" x2="440" y2="340" stroke="#444" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Drifting signal wave -->
  <path d="M 70 340 Q 90 340, 110 328 T 160 300 T 260 245 T 360 170 Q 400 145, 440 130" 
        fill="none" stroke="#f0f0f0" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 6 dots: 2 early + 2 mid + 2 late -->
  <circle cx="110" cy="328" r="4" fill="#f0f0f0" opacity="0.15"/>
  <circle cx="160" cy="300" r="5" fill="#f0f0f0" opacity="0.25"/>
  <circle cx="260" cy="245" r="6" fill="#f0f0f0" opacity="0.35"/>
  <circle cx="360" cy="170" r="8" fill="#f0f0f0" opacity="0.55"/>
  <circle cx="440" cy="130" r="10" fill="#f0f0f0" opacity="0.85"/>
  <!-- Endpoint pulse glow -->
  <circle cx="440" cy="130" r="16" fill="#f0f0f0" opacity="0.08"/>
</svg>