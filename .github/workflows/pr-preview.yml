name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ${{ steps.detect-package-manager.outputs.manager }}

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-

      # ── Build Next.js site ──

      - name: Install Next.js dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.runner }} next build
        env:
          NEXT_PUBLIC_BASE_PATH: /pr-preview/${{ github.event.pull_request.number }}

      # ── Build Astro docs site ──

      - name: Install Astro docs dependencies
        working-directory: docs
        run: npm ci

      - name: Build Astro docs (preview)
        working-directory: docs
        run: npm run build
        env:
          # Override the site base for PR preview deployment
          ASTRO_BASE: /pr-preview/${{ github.event.pull_request.number }}/docs

      - name: Merge docs into Next.js output
        run: |
          # Astro's base only sets URL prefixes — files are at the root of dist/.
          # Copy into out/docs/ so they're served at /docs/ in the preview.
          mkdir -p out/docs
          cp -r docs/dist/* out/docs/

      - name: Remove CNAME from preview build
        run: rm -f ./out/CNAME

      - name: Deploy to GitHub Pages (PR Preview)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          destination_dir: pr-preview/${{ github.event.pull_request.number }}
          keep_files: true
          user_name: eizus
          user_email: hello@cdr.xyz

      - name: Comment preview URL
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🚀 **PR Preview deployed!**

            | URL | Status |
            |-----|--------|
            | [Site](https://poaster.app/pr-preview/${{ github.event.pull_request.number }}/) | Ready |
            | [API Docs](https://poaster.app/pr-preview/${{ github.event.pull_request.number }}/docs/) | Ready |

            Preview will update automatically when you push more commits.
          edit-mode: replace

  cleanup:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Remove preview folder
        run: |
          cd gh-pages
          rm -rf pr-preview/${{ github.event.pull_request.number }}
          git config user.name "eizus"
          git config user.email "hello@cdr.xyz"
          git add -A
          git diff --staged --quiet || git commit -m "Remove PR preview for #${{ github.event.pull_request.number }}"
          git push
